name: 📦 Package kernellab (.deb)

on:
  push:
    branches: [main]
    paths:
      - "kernellab.py"
      - "klconsole.py"
      - "oracle_bridge.py"
      - "packaging/**"
      - "NOTES/**"
      - "app/**"
      - "tests/**"
      - "README.md"
      - "DEBIAN-STYLE.md"
      - ".github/workflows/package-deb.yml"
  workflow_dispatch:

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          V=$(grep -m1 '^Version:' packaging/control | awk '{print $2}')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "packaging kernellab $V"

      - name: Build rootless deb
        run: |
          chmod +x packaging/build.sh
          ./packaging/build.sh "${{ steps.ver.outputs.version }}" build

      - name: Verify deb
        run: |
          dpkg-deb --info build/*.deb
          echo '--- contents ---'
          dpkg-deb --contents build/*.deb
          dpkg-deb --contents build/*.deb | grep -F './usr/bin/kernellab'
          dpkg-deb --contents build/*.deb | grep -F './usr/bin/klconsole'
          dpkg-deb --contents build/*.deb | grep -F './usr/bin/oracle_bridge'
          dpkg-deb --contents build/*.deb | grep -F './Applications/KernelLab.app/Info.plist'
          dpkg-deb --contents build/*.deb | grep -F './Applications/KernelLab.app/icon@2x.png'

      - name: Unit tests
        run: python3 -m unittest tests.test_week1 tests.test_app_shell

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernellab-deb
          path: build/kernellab_*.deb
          if-no-files-found: error

      - name: Summary
        run: |
          echo "kernellab deb packages the CLI and Applications/KernelLab.app (rootless Procursus layout)." >> "$GITHUB_STEP_SUMMARY"
          echo "Ubuntu CI does not run Theos. A launchable Mach-O is produced with: make -C app clean all && ./packaging/build.sh" >> "$GITHUB_STEP_SUMMARY"